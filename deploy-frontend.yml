name: Deploy Frontend to AWS

# This tells GitHub to run this script every time you push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab the latest code from your repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Log into AWS using the secrets you saved in GitHub
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3. Copy the HTML, CSS, and JS to your S3 bucket
      # We exclude the terraform files, python files, and git folders so they don't end up on the web!
      - name: Sync files to S3
        run: |
          aws s3 sync . s3://rahul-resume-website-2026 --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude "*.tf" \
          --exclude "*.py" \
          --exclude "*.zip"

      # 4. Tell CloudFront to clear its cache so visitors see the new updates instantly
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"